# Dependabot: abre pull requests automaticamente quando sai versão nova de uma
# dependência. As atualizações são agrupadas para não virar uma enxurrada de PRs.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /infra/docker
    schedule:
      interval: weekly
    groups:
      imagens:
        patterns: ["*"]

  # Fase 5: as bibliotecas do treino do modelo de risco (ml/requisitos.txt). Uma versão nova pode
  # mudar o modelo gerado; o job "ml" do CI acusa, e aí se treina de novo de propósito.
  - package-ecosystem: pip
    directory: /ml
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # Fase 6: os provedores do Terraform. O plano e o simulador do workflow "Nuvem" acusam o que quebrar.
  - package-ecosystem: terraform
    directories:
      - /infra/terraform/aws
      - /infra/terraform/local
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]

  # Fase 6: as imagens de base do Dockerfile da raiz (fixadas por tag; o Dependabot abre a troca de versão).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      imagens-base:
        patterns: ["*"]
