# Dependabot: abre pull requests automaticamente quando sai versão nova de uma
# dependência. As atualizações são agrupadas para não virar uma enxurrada de PRs.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]
    # ADR-0028: o gateway fica no Spring Boot 4.0 até o Spring Cloud 2026.0 sair em versão final.
    # Sem esta regra, o grupo "maven" sobe o gateway para o Boot 4.1 junto com o resto.
    # Atualizações de correção (patch) continuam chegando; a troca de linha (minor) é à mão.
    ignore:
      - dependency-name: "org.springframework.boot:spring-boot-dependencies"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "org.springframework.boot:spring-boot-maven-plugin"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /infra/docker
    schedule:
      interval: weekly
    groups:
      imagens:
        patterns: ["*"]

  # Fase 5: as bibliotecas do treino do modelo de risco (ml/requisitos.txt). Uma versão nova pode
  # mudar o modelo gerado; o job "ml" do CI acusa, e aí se treina de novo de propósito.
  - package-ecosystem: pip
    directory: /ml
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # Terraform fora do Dependabot: o atualizador dele roda o Terraform 1.16.4 e a configuração
  # fixa exatamente o 1.17.1 (versions.tf), então toda execução semanal falhava no `terraform init`.
  # Os provedores ficam fixados no versions.tf e no .terraform.lock.hcl e se atualizam à mão.

  # Fase 6: as imagens de base do Dockerfile da raiz (fixadas por tag; o Dependabot abre a troca de versão).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      imagens-base:
        patterns: ["*"]
