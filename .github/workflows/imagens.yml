# Imagens Docker e Helm chart (Fase 6, ADR-0038 e ADR-0039).
#
# Confere, a cada mudança que mexe nelas:
#   - que cada imagem do Dockerfile da raiz ainda constrói (inclusive a nativa do pix);
#   - que o Helm chart passa no "helm lint" e que o YAML que ele gera é Kubernetes válido
#     (kubeconform compara cada objeto com o esquema oficial da API do Kubernetes).
# Não publica imagem em registro nenhum: o projeto roda local (ADR-0006).
#
# As actions são fixadas pelo SHA do commit, como no ci.yml. Helm e kubeconform são baixados do
# lançamento oficial com a soma SHA-256 conferida — nenhuma action de terceiros.

name: Imagens e chart

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - pom.xml
      - mvnw
      - .mvn/**
      - desempenho/**/pom.xml
      - lotes/**/pom.xml
      - bibliotecas/**
      - servicos/**
      - web/**
      - infra/k8s/**
      - scripts/imagens.sh
      - .github/workflows/imagens.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pom.xml
      - mvnw
      - .mvn/**
      - desempenho/**/pom.xml
      - lotes/**/pom.xml
      - bibliotecas/**
      - servicos/**
      - web/**
      - infra/k8s/**
      - scripts/imagens.sh
      - .github/workflows/imagens.yml

# Menor permissão possível: só lê o código.
permissions:
  contents: read

concurrency:
  group: imagens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chart:
    name: Helm chart (lint + kubeconform)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HELM: v4.3.1
      HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
      KUBECONFORM: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      KUBERNETES: 1.36.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar Helm e kubeconform (soma conferida)
        run: |
          curl -sSfL -o helm.tgz "https://get.helm.sh/helm-$HELM-linux-amd64.tar.gz"
          echo "$HELM_SHA256  helm.tgz" | sha256sum -c -
          curl -sSfL -o kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  kubeconform.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf helm.tgz -C "$RUNNER_TEMP" && mv "$RUNNER_TEMP/linux-amd64/helm" "$RUNNER_TEMP/bin/"
          tar -xzf kubeconform.tgz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # O lint com os dois arquivos de valores: o genérico e o do k3d.
      - name: helm lint
        run: |
          helm lint infra/k8s/ledgerly
          helm lint infra/k8s/ledgerly -f infra/k8s/ledgerly/values-k3d.yaml

      # Com um IP de exemplo em cada peça da infraestrutura, para os Services e EndpointSlices dela
      # também serem gerados e conferidos. -strict: campo que não existe no esquema é erro.
      - name: helm template | kubeconform
        shell: bash
        run: |
          set -o pipefail
          ips=""
          for i in postgres pgvector mongo redis kafka keycloak ollama lgtm; do ips+=" --set infraExterna.$i.ip=172.20.0.10"; done
          # shellcheck disable=SC2086
          helm template ledgerly infra/k8s/ledgerly -f infra/k8s/ledgerly/values-k3d.yaml $ips \
            --kube-version "$KUBERNETES" \
            | kubeconform -strict -summary -kubernetes-version "$KUBERNETES"
          # shellcheck disable=SC2086
          helm template ledgerly infra/k8s/ledgerly -f infra/k8s/ledgerly/values-k3d.yaml $ips \
            --set telemetria.ligada=true --kube-version "$KUBERNETES" \
            | kubeconform -strict -summary -kubernetes-version "$KUBERNETES"

  imagem:
    name: Imagem ${{ matrix.imagem }}
    runs-on: ubuntu-latest
    # A nativa leva uns 4 minutos de compilação; as outras, menos de 2 (sem o cache da sua máquina).
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        imagem: [razao, contas, extrato, assistente, antifraude, pix, gateway-ib, gateway-bo, pix-nativo]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Construir
        run: ./scripts/imagens.sh construir ${{ matrix.imagem }}
        env:
          PROGRESSO: plain
