# Integração contínua (CI): a cada envio para a main e a cada pull request, o GitHub
# compila o projeto, roda todos os testes e confere a infraestrutura local.
# Em repositório público, os minutos do GitHub Actions são gratuitos.
#
# As actions são fixadas pelo SHA do commit (não pela tag, que pode ser movida) —
# proteção contra ataque à cadeia de suprimentos. O Dependabot atualiza os SHAs.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Menor permissão possível: o CI só lê o código.
permissions:
  contents: read

# Um envio novo no mesmo branch cancela o CI anterior, que ficou desatualizado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar e testar (Java 25)
    runs-on: ubuntu-latest
    # Os testes de integração sobem PostgreSQL, MongoDB, Kafka e Redis em contêiner, e a Fase 2
    # dobrou o tempo do build. O limite é só a folga contra um build travado.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # verify = compila, testa, mede cobertura e confere as regras de arquitetura.
      - name: Build
        run: ./mvnw --batch-mode --no-transfer-progress verify

      # Os testes dos consumidores regravam contratos/. Se o arquivo mudou ou é novo, alguém mudou o que um
      # serviço espera do outro e não versionou: o provedor foi conferido contra o contrato antigo (ADR-0045).
      # O git diff não enxerga arquivo novo; o status enxerga.
      - name: Conferir que os contratos estão versionados
        run: |
          git status --porcelain contratos
          test -z "$(git status --porcelain contratos)"

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-jacoco
          path: "**/target/site/jacoco/"
          if-no-files-found: ignore
          retention-days: 14

  web:
    name: Front-end (tipos, testes e build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # npm ci: instala exatamente o que está no package-lock.json (nada de versão "parecida").
      - name: Instalar
        run: npm ci --no-audit --no-fund

      # TypeScript em modo estrito nos quatro pacotes (comum, as duas telas e o E2E).
      - name: Tipos
        run: npm run tipos

      - name: Testes (Vitest)
        run: npm run testar

      - name: Build (Vite)
        run: npm run construir

  ml:
    name: Treino do modelo de risco (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # O Python 3.12 do próprio runner basta; as versões das bibliotecas estão fixas no requisitos.txt.
      - name: Instalar
        run: python3 -m venv ml/.venv && ml/.venv/bin/pip install --quiet -r ml/requisitos.txt

      # Com a semente fixa, treinar de novo tem de dar o mesmo modelo (ADR-0032). Se não der, alguém
      # mudou o treino e não copiou o modelo, ou uma biblioteca mudou o resultado: o teste de
      # paridade do Java estaria conferindo outro modelo. A comparação tem tolerância porque o
      # processador da máquina do CI muda os últimos dígitos do treino (ADR-0043).
      - name: Treinar e conferir que o modelo é o mesmo
        run: |
          lscpu | grep -E "Model name|Flags" | sed -E 's/Flags:.*(avx512f).*/Tem AVX-512/; /Flags:/d'
          mkdir -p "$RUNNER_TEMP/versionado"
          cp ml/metricas.json servicos/antifraude/src/main/resources/modelo/pesos.json \
             servicos/antifraude/src/test/resources/modelo/referencia.csv "$RUNNER_TEMP/versionado/"
          ml/.venv/bin/python ml/treinar.py
          ml/.venv/bin/python ml/conferir.py "$RUNNER_TEMP/versionado"

  infra:
    name: Validar infraestrutura local
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validar o compose.yaml
        run: docker compose -f infra/docker/compose.yaml config --quiet

      # Sobe tudo e espera cada contêiner ficar saudável (healthcheck). O Ollama tem o perfil "ia"
      # (precisa de placa de vídeo) e fica de fora: nenhum teste depende dele.
      - name: Subir a infraestrutura
        run: docker compose -f infra/docker/compose.yaml up -d --wait --wait-timeout 300

      - name: Conferir o isolamento entre bancos
        run: |
          # O usuário do pix NÃO pode conectar no banco do razão.
          if docker compose -f infra/docker/compose.yaml exec -T -e PGPASSWORD=pix_local \
               postgres psql -h localhost -U pix -d razao -c "select 1" </dev/null; then
            echo "::error::O usuário pix conseguiu entrar no banco razao"
            exit 1
          fi
          # O antifraude (Fase 5) também não entra no banco de outro serviço.
          if docker compose -f infra/docker/compose.yaml exec -T -e PGPASSWORD=antifraude_local \
               postgres psql -h localhost -U antifraude -d pix -c "select 1" </dev/null; then
            echo "::error::O usuário antifraude conseguiu entrar no banco pix"
            exit 1
          fi
          echo "Isolamento confirmado."

      - name: Conferir o pgvector do assistente
        run: |
          # Fase 5: o init do contêiner cria o banco do assistente com a extensão vector.
          docker compose -f infra/docker/compose.yaml exec -T -e PGPASSWORD=assistente_local \
            pgvector psql -h localhost -U assistente -d assistente -tAc \
            "select extname from pg_extension where extname = 'vector'" </dev/null | grep -qx vector \
            || { echo "::error::O banco assistente não tem a extensão vector"; exit 1; }
          echo "pgvector confirmado."

      - name: Conferir os tópicos do Kafka
        run: |
          # A criação automática está desligada: os serviços dependem destes seis tópicos.
          topicos=$(docker compose -f infra/docker/compose.yaml exec -T kafka \
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list </dev/null)
          for t in contas.eventos.v1 razao.lancamentos.v1 pix.transferencias.v1; do
            for nome in "$t" "$t.dlt"; do
              grep -qx "$nome" <<< "$topicos" || { echo "::error::Falta o tópico $nome"; exit 1; }
            done
          done
          echo "Tópicos confirmados."
          # O Kafka tem de gravar no volume: em /tmp, um "down" apagaria os eventos (ADR-0047).
          docker compose -f infra/docker/compose.yaml exec -T kafka \
            test -d /var/lib/kafka/data/contas.eventos.v1-0 </dev/null \
            || { echo "::error::O Kafka não está gravando no volume"; exit 1; }
          echo "Eventos no volume."

      - name: Conferir o realm do Keycloak
        run: |
          # O realm é código (infra/docker/keycloak): o cliente de ferramentas tem de conseguir um token.
          curl -sf -d grant_type=client_credentials -d client_id=ledgerly-ferramentas \
            -d client_secret=ferramentas-segredo-local \
            http://localhost:18081/realms/ledgerly/protocol/openid-connect/token | grep -q '"access_token"' \
            || { echo "::error::O realm ledgerly não entregou o token de serviço"; exit 1; }
          echo "Realm confirmado."

      - name: Derrubar
        if: always()
        run: docker compose -f infra/docker/compose.yaml down -v
