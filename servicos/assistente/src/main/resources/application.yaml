# Configuração do serviço assistente. Valores entre ${...:padrão} podem ser trocados por variável
# de ambiente (por exemplo ASSISTENTE_OLLAMA_URL) sem recompilar.

server:
  port: ${ASSISTENTE_PORTA:8086}

spring:
  application:
    name: assistente
  threads:
    virtual:
      enabled: true
  # O pgvector: o PostgreSQL com a extensão de vetores, só com os artigos de ajuda (nenhum dado de cliente).
  datasource:
    url: ${ASSISTENTE_BANCO_URL:jdbc:postgresql://localhost:15433/assistente}
    username: ${ASSISTENTE_BANCO_USUARIO:assistente}
    password: ${ASSISTENTE_BANCO_SENHA:assistente_local}
  mvc:
    problemdetails:
      enabled: true

management:
  # OpenTelemetry (ADR-0042). Desligado por padrão: ./scripts/servicos.sh com LEDGERLY_OTEL=1 envia
  # rastros e métricas ao otel-lgtm, sem recompilar. Sem coletor, nada fica tentando enviar.
  tracing:
    sampling:
      probability: ${OTEL_AMOSTRAGEM:1.0}
    export:
      otlp:
        enabled: ${OTEL_LIGADO:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_ENDPOINT:http://localhost:14318}/v1/traces
  otlp:
    metrics:
      export:
        enabled: ${OTEL_LIGADO:false}
        url: ${OTEL_ENDPOINT:http://localhost:14318}/v1/metrics
        step: 10s
  logging:
    export:
      otlp:
        enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # Um rastro por rodada de agendador só enterraria os do Pix, e os passos do filtro de segurança
  # só alongariam cada rastro.
  observations:
    enable:
      tasks.scheduled: false
      spring.security: false
  endpoints:
    web:
      exposure:
        include: health,info

assistente:
  # O modelo de linguagem local, no Ollama (ADR-0034). Custo zero: nenhuma API paga.
  linguagem:
    url: ${ASSISTENTE_OLLAMA_URL:http://localhost:11434}
    modelo: ${ASSISTENTE_MODELO_DE_LINGUAGEM:qwen3:4b-instruct-2507-q4_K_M}
    tempo-limite: ${ASSISTENTE_LINGUAGEM_TEMPO_LIMITE:60s}
  ajuda:
    # bge-m3: modelo de vetores multilíngue (o português vai bem), 1024 dimensões.
    modelo-de-vetores: ${ASSISTENTE_MODELO_DE_VETORES:bge-m3}
    dimensao: 1024
    # Abaixo disso, o trecho não tem a ver com a pergunta e não vai junto.
    semelhanca-minima: 0.55

ledgerly:
  seguranca:
    emissor: ${LEDGERLY_EMISSOR:http://localhost:18081/realms/ledgerly}
    audiencia: ledgerly-api
  # As ferramentas leem com o token da pessoa: o contas e o extrato conferem o dono (ADR-0026).
  contas:
    url: ${ASSISTENTE_CONTAS_URL:http://localhost:8081}
  extrato:
    url: ${ASSISTENTE_EXTRATO_URL:http://localhost:8084}
  bancario:
    tempo-conexao: 2s
    tempo-resposta: 3s
