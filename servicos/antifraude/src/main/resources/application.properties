# Configuração do antifraude (Quarkus, ADR-0032).
#
# Perfis: "%prod." vale para o jar rodando (java -jar), "%dev." para o modo de desenvolvimento
# (./mvnw quarkus:dev). Nos testes, o Quarkus sobe sozinho um PostgreSQL em contêiner (Dev Services).
# ${VARIAVEL:padrão}: o valor pode ser trocado por variável de ambiente sem recompilar.

quarkus.application.name=antifraude
quarkus.http.port=${ANTIFRAUDE_PORTA:8085}
# Porta aleatória nos testes: não colide com nada que já esteja rodando na máquina.
quarkus.http.test-port=0
quarkus.banner.enabled=false

# ---- PostgreSQL (banco próprio: o antifraude não lê o banco de ninguém) ----
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=${ANTIFRAUDE_DB_POOL:20}
%prod.quarkus.datasource.jdbc.url=${ANTIFRAUDE_DB_URL:jdbc:postgresql://localhost:15432/antifraude}
%prod.quarkus.datasource.username=${ANTIFRAUDE_DB_USUARIO:antifraude}
%prod.quarkus.datasource.password=${ANTIFRAUDE_DB_SENHA:antifraude_local}
%dev.quarkus.datasource.jdbc.url=${ANTIFRAUDE_DB_URL:jdbc:postgresql://localhost:15432/antifraude}
%dev.quarkus.datasource.username=${ANTIFRAUDE_DB_USUARIO:antifraude}
%dev.quarkus.datasource.password=${ANTIFRAUDE_DB_SENHA:antifraude_local}
quarkus.datasource.devservices.image-name=postgres:18.6-alpine
quarkus.flyway.migrate-at-start=true

# ---- Segurança (ADR-0025) ----
# Confere o token de quem chama como o pix: assinatura (chaves públicas do Keycloak), emissor,
# validade e audiência; os papéis vêm de realm_access.roles.
quarkus.oidc.auth-server-url=${LEDGERLY_EMISSOR:http://localhost:18081/realms/ledgerly}
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=${LEDGERLY_AUDIENCIA:ledgerly-api}
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.keycloak.devservices.enabled=false
# Nos testes, quem diz quem é o usuário é o @TestSecurity: sem emissor nenhum para procurar.
%test.quarkus.oidc.tenant-enabled=false
quarkus.http.auth.proactive=false
# Negar por padrão: rota REST sem @RolesAllowed/@PermitAll é recusada.
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# ---- Saúde ----
quarkus.smallrye-health.root-path=/q/health

# ---- Cobertura nos testes ----
%test.quarkus.jacoco.report=false

# O modelo de linguagem local que escreve a explicação para a analista (ADR-0034). Roda no Ollama,
# na própria máquina: nenhuma API paga, nenhum dado sai. O limite de tempo é generoso (a primeira
# chamada carrega o modelo na GPU); passou dele, vale o texto fixo, e a próxima leitura tenta de novo.
antifraude.linguagem.url=${ANTIFRAUDE_OLLAMA_URL:http://localhost:11434}
antifraude.linguagem.modelo=${ANTIFRAUDE_MODELO_DE_LINGUAGEM:gemma3:4b}
antifraude.linguagem.tempo-limite=${ANTIFRAUDE_LINGUAGEM_TEMPO_LIMITE:30s}
