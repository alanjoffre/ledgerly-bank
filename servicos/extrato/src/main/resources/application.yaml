# Configuração do serviço extrato. Valores entre ${...:padrão} podem ser trocados por variável
# de ambiente (por exemplo EXTRATO_MONGO_URI) sem recompilar.

server:
  port: ${EXTRATO_PORTA:8084}

spring:
  application:
    name: extrato
  # Virtual threads: cada requisição (e cada consumidor do Kafka) roda numa thread leve.
  threads:
    virtual:
      enabled: true
  mongodb:
    # Usuário próprio do extrato, que só enxerga o banco "extrato" (infra/docker/mongo/init).
    uri: ${EXTRATO_MONGO_URI:mongodb://extrato:extrato_local@localhost:17017/extrato?authSource=extrato}
  kafka:
    bootstrap-servers: ${EXTRATO_KAFKA:localhost:19092}
    consumer:
      group-id: extrato
      # Grupo novo (ou reconstrução): começa do primeiro evento guardado, não do próximo a chegar.
      auto-offset-reset: earliest
    producer:
      # Só para a DLT: a mensagem morta só conta como guardada quando todas as réplicas confirmam.
      acks: all
    listener:
      # Uma thread por partição (os tópicos têm 3).
      concurrency: 3
  # Token de serviço (client credentials) para perguntar ao contas de quem é a conta (ADR-0027).
  # O token-uri explícito deixa o serviço subir com o Keycloak fora do ar.
  security:
    oauth2:
      client:
        registration:
          ledgerly:
            provider: keycloak
            client-id: ${EXTRATO_CLIENTE_ID:ledgerly-extrato}
            client-secret: ${EXTRATO_CLIENTE_SEGREDO:extrato-segredo-local}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${LEDGERLY_EMISSOR:http://localhost:18081/realms/ledgerly}/protocol/openid-connect/token
  mvc:
    problemdetails:
      enabled: true
  messages:
    basename: mensagens

management:
  # OpenTelemetry (ADR-0042). Desligado por padrão: ./scripts/servicos.sh com LEDGERLY_OTEL=1 envia
  # rastros e métricas ao otel-lgtm, sem recompilar. Sem coletor, nada fica tentando enviar.
  tracing:
    sampling:
      probability: ${OTEL_AMOSTRAGEM:1.0}
    export:
      otlp:
        enabled: ${OTEL_LIGADO:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_ENDPOINT:http://localhost:14318}/v1/traces
  otlp:
    metrics:
      export:
        enabled: ${OTEL_LIGADO:false}
        url: ${OTEL_ENDPOINT:http://localhost:14318}/v1/metrics
        step: 10s
  logging:
    export:
      otlp:
        enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # Um rastro por rodada de agendador só enterraria os do Pix, e os passos do filtro de segurança
  # só alongariam cada rastro.
  observations:
    enable:
      tasks.scheduled: false
      spring.security: false
  endpoints:
    web:
      exposure:
        include: health,info

ledgerly:
  # Quem emite os tokens que este serviço aceita (ADR-0024). A chave pública vem do JWKS do emissor.
  seguranca:
    emissor: ${LEDGERLY_EMISSOR:http://localhost:18081/realms/ledgerly}
    audiencia: ledgerly-api
  # O contas responde de quem é a conta (só o dono lê o extrato). A resposta fica num cache sem
  # prazo — o dono não muda —, limitado a tantas contas.
  contas:
    url: ${EXTRATO_CONTAS_URL:http://localhost:8081}
    tempo-conexao: 2s
    tempo-resposta: 3s
    cache-de-donos: 100000
