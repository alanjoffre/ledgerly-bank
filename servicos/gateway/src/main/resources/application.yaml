# Configuração do gateway (BFF). Suba sempre com um perfil:
#   internet-banking  →  :8080, cookie LEDGERLY_IB, papel cliente
#   backoffice        →  :8090, cookie LEDGERLY_BO, papel analista
# Exemplo: java -jar gateway.jar --spring.profiles.active=internet-banking

spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  web:
    resources:
      # Os arquivos da tela (index.html, /assets/...) saem da pasta construída de cada front-end.
      static-locations: ${ledgerly.bff.pagina}

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        # HttpOnly: o JavaScript não lê o cookie (um XSS não leva a sessão). SameSite=Lax: o
        # navegador não manda o cookie num POST vindo de outro site. "secure" fica desligado só
        # porque o ambiente local é http; em nuvem, com https, liga (ver docs/adr/0025).
        http-only: true
        same-site: lax

ledgerly:
  bff:
    emissor: ${LEDGERLY_EMISSOR:http://localhost:18081/realms/ledgerly}
    servicos:
      contas: ${GATEWAY_CONTAS_URL:http://localhost:8081}
      extrato: ${GATEWAY_EXTRATO_URL:http://localhost:8084}
      pix: ${GATEWAY_PIX_URL:http://localhost:8083}
      antifraude: ${GATEWAY_ANTIFRAUDE_URL:http://localhost:8085}
      assistente: ${GATEWAY_ASSISTENTE_URL:http://localhost:8086}

management:
  # OpenTelemetry (ADR-0042). Desligado por padrão: ./scripts/servicos.sh com LEDGERLY_OTEL=1 envia
  # rastros e métricas ao otel-lgtm, sem recompilar. Sem coletor, nada fica tentando enviar.
  tracing:
    sampling:
      probability: ${OTEL_AMOSTRAGEM:1.0}
    export:
      otlp:
        enabled: ${OTEL_LIGADO:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_ENDPOINT:http://localhost:14318}/v1/traces
  otlp:
    metrics:
      export:
        enabled: ${OTEL_LIGADO:false}
        url: ${OTEL_ENDPOINT:http://localhost:14318}/v1/metrics
        step: 10s
  logging:
    export:
      otlp:
        enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # Um rastro por rodada de agendador só enterraria os do Pix, e os passos do filtro de segurança
  # só alongariam cada rastro.
  observations:
    enable:
      tasks.scheduled: false
      spring.security: false
  endpoints:
    web:
      exposure:
        include: health

---
spring:
  config:
    activate:
      on-profile: internet-banking
# Os dois BFFs são o mesmo pacote; nos rastros, cada um com o seu nome.
management:
  opentelemetry:
    resource-attributes:
      "[service.name]": gateway-ib
server:
  port: ${GATEWAY_PORTA:8080}
  servlet:
    session:
      cookie:
        name: LEDGERLY_IB
ledgerly:
  bff:
    papel: cliente
    # A tela construída (npm run construir). Caminho relativo à pasta de onde o gateway sobe (a raiz do repositório).
    pagina: ${GATEWAY_PAGINA:file:web/internet-banking/dist/}
    cliente-id: ledgerly-internet-banking
    cliente-segredo: ${GATEWAY_CLIENTE_SEGREDO:ib-segredo-local}

---
spring:
  config:
    activate:
      on-profile: backoffice
# Os dois BFFs são o mesmo pacote; nos rastros, cada um com o seu nome.
management:
  opentelemetry:
    resource-attributes:
      "[service.name]": gateway-bo
server:
  port: ${GATEWAY_PORTA:8090}
  servlet:
    session:
      cookie:
        name: LEDGERLY_BO
ledgerly:
  bff:
    papel: analista
    pagina: ${GATEWAY_PAGINA:file:web/backoffice/dist/}
    cliente-id: ledgerly-backoffice
    cliente-segredo: ${GATEWAY_CLIENTE_SEGREDO:bo-segredo-local}
