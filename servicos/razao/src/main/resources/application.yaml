# Configuração do serviço razão. Valores entre ${...:padrão} podem ser trocados por variável
# de ambiente (por exemplo RAZAO_DB_URL) sem recompilar — é assim que ele roda no Kubernetes.

server:
  port: ${RAZAO_PORTA:8082}

spring:
  application:
    name: razao
  # Threads de plataforma (as do sistema, num pool do Tomcat), e não virtual threads: medido na
  # Fase 3, o razão atendeu de 14% a 28% mais pedidos assim. O limite do razão é o pool de conexões
  # com o banco, não o número de threads, então as virtual threads não têm o que ganhar aqui
  # (ADR-0020). RAZAO_THREADS_VIRTUAIS=true liga as virtual threads de novo, para medir outra vez.
  threads:
    virtual:
      enabled: ${RAZAO_THREADS_VIRTUAIS:false}
  datasource:
    url: ${RAZAO_DB_URL:jdbc:postgresql://localhost:15432/razao}
    username: ${RAZAO_DB_USUARIO:razao}
    password: ${RAZAO_DB_SENHA:razao_local}
    hikari:
      maximum-pool-size: ${RAZAO_DB_POOL:20}
  mvc:
    # Erros do próprio Spring (JSON malformado, cabeçalho faltando) também saem em Problem Details.
    problemdetails:
      enabled: true
  messages:
    basename: mensagens
  # Kafka: o razão publica os lançamentos (pelo Outbox) e consome os eventos de conta.
  kafka:
    bootstrap-servers: ${RAZAO_KAFKA:localhost:19092}
    producer:
      # acks=all + idempotência: o Kafka só confirma depois de gravar em todas as réplicas, e uma
      # nova tentativa do produtor não duplica a mensagem no tópico.
      acks: all
      properties:
        enable.idempotence: true
        # Com o Kafka fora do ar, o publicador desiste em segundos (e tenta na próxima rodada),
        # em vez de ficar preso o padrão de 1 minuto.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      # Grupo novo começa do início do tópico: nenhuma conta aberta antes fica de fora.
      auto-offset-reset: earliest

razao:
  # Contas quentes (ADR-0019): o Caixa e a Liquidação Pix divididos em sub-contas, de 1 a 16.
  contas-quentes:
    subcontas: ${RAZAO_SUBCONTAS:16}
  outbox:
    intervalo-ms: ${RAZAO_OUTBOX_INTERVALO_MS:100}
    lote: 100

ledgerly:
  # Quem emite os tokens que este serviço aceita (ADR-0024). A chave pública vem do JWKS do emissor.
  seguranca:
    emissor: ${LEDGERLY_EMISSOR:http://localhost:18081/realms/ledgerly}
    audiencia: ledgerly-api

management:
  endpoints:
    web:
      exposure:
        include: health,info
