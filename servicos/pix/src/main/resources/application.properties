# Configuração do serviço Pix (Quarkus).
#
# Perfis: "%prod." vale para o jar rodando (java -jar), "%dev." para o modo de desenvolvimento
# (./mvnw quarkus:dev). Nos testes ("%test", o padrão sem prefixo), o Quarkus sobe sozinho um
# PostgreSQL, um Kafka e um Redis em contêiner (Dev Services) — por isso o endereço deles só é
# configurado em prod e dev.
# ${VARIAVEL:padrão}: o valor pode ser trocado por variável de ambiente sem recompilar.

quarkus.application.name=pix
quarkus.http.port=${PIX_PORTA:8083}
# Porta aleatória nos testes: não colide com nada que já esteja rodando na máquina.
quarkus.http.test-port=0
quarkus.banner.enabled=false

# ---- PostgreSQL ----
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=${PIX_DB_POOL:20}
%prod.quarkus.datasource.jdbc.url=${PIX_DB_URL:jdbc:postgresql://localhost:15432/pix}
%prod.quarkus.datasource.username=${PIX_DB_USUARIO:pix}
%prod.quarkus.datasource.password=${PIX_DB_SENHA:pix_local}
%dev.quarkus.datasource.jdbc.url=${PIX_DB_URL:jdbc:postgresql://localhost:15432/pix}
%dev.quarkus.datasource.username=${PIX_DB_USUARIO:pix}
%dev.quarkus.datasource.password=${PIX_DB_SENHA:pix_local}
# Nos testes, a mesma versão do Docker Compose.
quarkus.datasource.devservices.image-name=postgres:18.6-alpine
# Flyway: aplica as migrações (db/migration/V1__...) ao subir.
quarkus.flyway.migrate-at-start=true

# ---- Redis (trava rápida contra pedido repetido, ADR-0018) ----
%prod.quarkus.redis.hosts=${PIX_REDIS:redis://localhost:16379}
%dev.quarkus.redis.hosts=${PIX_REDIS:redis://localhost:16379}
quarkus.redis.devservices.image-name=redis:8.10.0-alpine
# Redis lento ou fora do ar não pode segurar o Pix: desiste em 1 s e segue sem a trava.
quarkus.redis.timeout=1s

# ---- Kafka (publicador do Outbox) ----
%prod.kafka.bootstrap.servers=${PIX_KAFKA:localhost:19092}
%dev.kafka.bootstrap.servers=${PIX_KAFKA:localhost:19092}
mp.messaging.outgoing.pix-transferencias.connector=smallrye-kafka
mp.messaging.outgoing.pix-transferencias.topic=pix.transferencias.v1
mp.messaging.outgoing.pix-transferencias.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.pix-transferencias.value.serializer=org.apache.kafka.common.serialization.StringSerializer
# acks=all + idempotência, como no razão: só confirma gravado, e a nova tentativa não duplica.
mp.messaging.outgoing.pix-transferencias.acks=all
mp.messaging.outgoing.pix-transferencias.enable.idempotence=true
mp.messaging.outgoing.pix-transferencias.max.block.ms=5000
mp.messaging.outgoing.pix-transferencias.request.timeout.ms=5000
mp.messaging.outgoing.pix-transferencias.delivery.timeout.ms=10000
pix.outbox.intervalo-ms=${PIX_OUTBOX_INTERVALO_MS:100}

# ---- Razão e contas (HTTP) ----
quarkus.rest-client.razao.url=${PIX_RAZAO_URL:http://localhost:8082}
quarkus.rest-client.contas.url=${PIX_CONTAS_URL:http://localhost:8081}
# Tempo-limite curto: um razão lento vira "sem resposta" em 3 s, e a Saga tenta de novo depois,
# em vez de prender o pedido do cliente.
quarkus.rest-client.razao.connect-timeout=1000
quarkus.rest-client.razao.read-timeout=3000
quarkus.rest-client.contas.connect-timeout=1000
quarkus.rest-client.contas.read-timeout=3000
# ---- Antifraude (HTTP, ADR-0033) ----
# Limite bem mais curto que o do razão: o antifraude responde em milissegundos, e o cliente está
# esperando. Passou de 800 ms, vale a falha segura por valor (TransferenciaPix.LIMITE_SEM_ANTIFRAUDE).
quarkus.rest-client.antifraude.url=${PIX_ANTIFRAUDE_URL:http://localhost:8085}
quarkus.rest-client.antifraude.connect-timeout=300
quarkus.rest-client.antifraude.read-timeout=800
# Status 4xx/5xx chegam como resposta, não como exceção: quem decide o que significam é o adaptador.
microprofile.rest.client.disable.default.mapper=true

# ---- Segurança (ADR-0025) ----
# O Pix confere o token de quem chama: assinatura (chaves públicas do Keycloak), emissor, validade
# e audiência. Os papéis vêm de realm_access.roles, como nos serviços Spring.
quarkus.oidc.auth-server-url=${LEDGERLY_EMISSOR:http://localhost:18081/realms/ledgerly}
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=${LEDGERLY_AUDIENCIA:ledgerly-api}
quarkus.oidc.roles.role-claim-path=realm_access/roles
# Sem Keycloak automático nos testes: o teste sobe um emissor falso (ServicosFalsos).
quarkus.keycloak.devservices.enabled=false
# A autenticação acontece só na rota que pede (não em todo pedido): assim o 401 e o 403 passam
# pelos mesmos tradutores de erro e saem no formato Problem Details.
quarkus.http.auth.proactive=false
# Negar por padrão: rota REST sem @RolesAllowed/@PermitAll é recusada — esquecer a anotação não abre a rota.
quarkus.security.jaxrs.deny-unannotated-endpoints=true
# O token do próprio Pix para chamar o razão e contas (client credentials). Pedido na 1ª chamada
# (não na subida, para o Pix subir mesmo com o Keycloak fora) e renovado antes de vencer.
quarkus.oidc-client.auth-server-url=${quarkus.oidc.auth-server-url}
quarkus.oidc-client.client-id=${PIX_CLIENTE_ID:ledgerly-pix}
quarkus.oidc-client.credentials.secret=${PIX_CLIENTE_SEGREDO:pix-segredo-local}
quarkus.oidc-client.grant.type=client
quarkus.oidc-client.early-tokens-acquisition=false

# ---- Saga ----
pix.saga.intervalo=${PIX_SAGA_INTERVALO:1s}

# ---- Saúde ----
# /q/health: o Kubernetes pergunta aqui se o serviço está vivo (Fase 6).
quarkus.smallrye-health.root-path=/q/health

# ---- OpenTelemetry (ADR-0042) ----
# Desligado por padrão: ./scripts/servicos.sh com LEDGERLY_OTEL=1 envia rastros e métricas ao
# otel-lgtm, sem recompilar. Sem coletor, nada fica tentando enviar.
quarkus.otel.sdk.disabled=${OTEL_SDK_DESLIGADO:true}
quarkus.otel.exporter.otlp.endpoint=${OTEL_ENDPOINT:http://localhost:14318}
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.metric.export.interval=10s
quarkus.otel.traces.sampler.arg=${OTEL_AMOSTRAGEM:1.0}
quarkus.otel.traces.sampler=parentbased_traceidratio

# ---- Cobertura nos testes ----
# A extensão quarkus-jacoco só grava a medição; o relatório é o do build (soma de todas).
%test.quarkus.jacoco.report=false
