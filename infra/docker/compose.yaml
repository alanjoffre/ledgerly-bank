# Infraestrutura local do Ledgerly Bank.
#
# O que é: o Docker Compose sobe vários contêineres (programas isolados) de uma vez,
# com um comando só. Aqui ficam os bancos de dados e o Kafka que os serviços usam.
#
#   Subir:   docker compose -f infra/docker/compose.yaml up -d
#   Status:  docker compose -f infra/docker/compose.yaml ps
#   Parar:   docker compose -f infra/docker/compose.yaml down        (mantém os dados)
#   Zerar:   docker compose -f infra/docker/compose.yaml down -v     (APAGA os dados)
#
# Portas: todas começam com 1 (15432, 17017...) para não colidir com um Postgres,
# Mongo ou Redis que já exista na máquina. Todas escutam só em 127.0.0.1 (a própria
# máquina), nunca na rede.
#
# Senhas: são de ambiente LOCAL, de propósito simples e públicas. Em nuvem, as senhas
# vêm de um cofre (AWS Secrets Manager) — ver docs/adr/0006.

name: ledgerly

services:

  # PostgreSQL — banco relacional. Guarda o que exige consistência forte:
  # contas, razão contábil (lançamentos) e transferências Pix.
  # Um banco (database) por serviço: nenhum serviço lê a tabela do outro.
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ledgerly_admin
      POSTGRES_PASSWORD: ledgerly_local
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      # A partir do Postgres 18 a imagem guarda os dados em /var/lib/postgresql/<versão>.
      - postgres-dados:/var/lib/postgresql
      # Scripts nesta pasta rodam só na PRIMEIRA subida (com o volume vazio).
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerly_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # PostgreSQL com pgvector — o banco do assistente (Fase 5, ADR-0036). O pgvector é uma extensão
  # que guarda vetores (a "impressão digital" do sentido de um texto) e busca os mais parecidos:
  # é onde ficam os trechos dos artigos de ajuda. Um contêiner à parte porque a imagem do
  # Postgres de cima não traz a extensão; o banco continua sendo só do assistente.
  pgvector:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_USER: ledgerly_admin
      POSTGRES_PASSWORD: ledgerly_local
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - pgvector-dados:/var/lib/postgresql
      # Só na PRIMEIRA subida: cria o usuário e o banco do assistente, com a extensão ligada.
      - ./pgvector/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerly_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # MongoDB — banco de documentos (NoSQL). Guarda o extrato: o "modelo de leitura"
  # do CQRS, montado a partir dos eventos e otimizado para a tela do cliente.
  mongo:
    image: mongo:9.0.4
    environment:
      MONGO_INITDB_ROOT_USERNAME: ledgerly_admin
      MONGO_INITDB_ROOT_PASSWORD: ledgerly_local
    ports:
      - "127.0.0.1:17017:27017"
    volumes:
      - mongo-dados:/data/db
      # Scripts nesta pasta rodam só na PRIMEIRA subida (com o volume vazio): criam o usuário do extrato.
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Redis — banco em memória, muito rápido. Usos: chave de idempotência (não
  # processar o mesmo Pix duas vezes), cache, limite de requisições e as regras
  # de velocidade do antifraude ("mais de 5 Pix em 1 minuto").
  redis:
    image: redis:8.10.0-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-dados:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Kafka — o "correio" de eventos entre os serviços. Quando o razão registra um
  # lançamento, publica um evento; o extrato e o antifraude consomem, cada um no
  # seu ritmo. Modo KRaft: o Kafka se coordena sozinho, sem o antigo ZooKeeper.
  kafka:
    image: apache/kafka:4.4.0
    ports:
      - "127.0.0.1:19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Três "portas de entrada": INTERNO (outros contêineres), EXTERNO (sua máquina)
      # e CONTROLLER (coordenação interna do próprio Kafka).
      KAFKA_LISTENERS: INTERNO://:9092,EXTERNO://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka:9092,EXTERNO://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNO:PLAINTEXT,EXTERNO:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      # Um nó só (ambiente local): réplica 1. Em produção seriam 3.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # Tópico só existe se for criado de propósito — um nome digitado errado vira erro, não um tópico novo.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      # Sem isto, a imagem grava em /tmp/kafka-logs, DENTRO do contêiner, e o volume fica vazio: um
      # "down" apagaria os eventos, inclusive o tópico de onde o extrato se reconstrói.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-dados:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  # Cria os tópicos do Kafka (a criação automática está desligada). Fica "saudável" só depois de
  # criá-los — então "up --wait" não termina antes. Tópico que já existe fica como está.
  kafka-topicos:
    image: apache/kafka:4.4.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/criar-topicos.sh"]
    volumes:
      - ./kafka/criar-topicos.sh:/scripts/criar-topicos.sh:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/topicos-criados"]
      interval: 2s
      timeout: 2s
      retries: 60

  # Keycloak — o servidor de identidade (OAuth2 / OpenID Connect). Faz o login das pessoas
  # e entrega os tokens que os serviços conferem. O realm "ledgerly" (usuários, papéis e
  # clientes) é código: infra/docker/keycloak/ledgerly-realm.json, importado na primeira
  # subida (ver docs/adr/0024). Console de administração: http://localhost:18081 (admin/admin).
  #
  # KC_HOSTNAME fixo: o "emissor" (iss) do token sai igual no navegador e nos serviços, que
  # rodam fora do Docker e chamam localhost:18081 — se mudasse, o serviço recusaria o token.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:18081
      # Fase 6 (ADR-0039): o emissor continua localhost:18081, mas os endereços de servidor para
      # servidor (*back-channel*: token, chaves públicas) seguem o endereço de quem pediu — um pod do
      # k3d chama http://keycloak:8080/... e recebe de volta endereços keycloak:8080 na descoberta.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx512m"
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      # start-dev guarda os dados num H2 de arquivo, dentro de /opt/keycloak/data. O volume
      # monta a pasta inteira (que já existe na imagem com o dono certo); montar uma subpasta
      # nova a criaria como root, e o Keycloak não conseguiria gravar.
      - keycloak-dados:/opt/keycloak/data
      # O realm só é importado se ainda não existir: mudou o JSON? "down -v" e suba de novo.
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # A imagem não tem curl: o bash abre a conexão sozinho (/dev/tcp) na porta de gerência.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # Ollama — roda o modelo de linguagem na própria máquina, de graça e sem mandar dado para fora
  # (ADR-0034). Usa a placa de vídeo (GPU NVIDIA): por isso fica num perfil à parte, e o CI, que
  # não tem placa de vídeo, não o sobe. Sem ele, a explicação do antifraude cai no texto fixo e o
  # assistente responde a mensagem de reserva: nada quebra.
  #   docker compose -f infra/docker/compose.yaml --profile ia up -d --wait
  #   ./scripts/modelos.sh           (baixa os modelos uma vez: qwen3:4b-instruct, gemma3:4b e bge-m3)
  ollama:
    image: ollama/ollama:0.40.13
    profiles: ["ia"]
    environment:
      # O modelo fica na memória da placa por 30 min depois do último uso: a 1ª resposta é a lenta.
      OLLAMA_KEEP_ALIVE: 30m
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-modelos:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Observabilidade (perfil "observabilidade", ADR-0042): Grafana, Tempo, Prometheus e o coletor
  # OpenTelemetry numa imagem só, para a máquina local. Ocupa 3,7 GB, por isso fica de fora do padrão.
  # Grafana em http://localhost:13000; os serviços enviam com LEDGERLY_OTEL=1 ./scripts/servicos.sh subir
  lgtm:
    image: grafana/otel-lgtm:0.36.0@sha256:57c04cbd8e7022f32bb84c4ac005d79baf8b08e2c5be44facf11f5f1f9944ba2
    profiles: ["observabilidade"]
    ports:
      - "127.0.0.1:13000:3000"
      - "127.0.0.1:14318:4318"
    volumes:
      - ../observabilidade/provedor-ledgerly.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/ledgerly.yaml:ro
      - ../observabilidade/paineis:/otel-lgtm/paineis-ledgerly:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health && curl -sf http://localhost:9090/-/ready && curl -sf http://localhost:3200/ready"]
      interval: 5s
      timeout: 5s
      retries: 30

  # SonarQube local: análise de código, sem conta nem custo (ADR-0046). Ocupa ~2 GB de memória, por isso fica
  # de fora do padrão. Em http://localhost:19000; como rodar, em docs/runbooks/qualidade.md
  sonarqube:
    image: sonarqube:26.10.0.133078-community@sha256:f95aaa9016dd4e92c7d70691167a6d96dbb5d8acffd61eba1cb4335d364a7840
    profiles: ["qualidade"]
    ports:
      - "127.0.0.1:19000:9000"
    volumes:
      - sonarqube-dados:/opt/sonarqube/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 40

  # Kafka UI — tela web para ver tópicos e mensagens. Opcional: só sobe com
  #   docker compose -f infra/docker/compose.yaml --profile ferramentas up -d
  # e abre em http://localhost:18080
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    profiles: ["ferramentas"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: ledgerly-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:18080:8080"

volumes:
  postgres-dados:
  sonarqube-dados:
  pgvector-dados:
  ollama-modelos:
  mongo-dados:
  redis-dados:
  kafka-dados:
  keycloak-dados:
